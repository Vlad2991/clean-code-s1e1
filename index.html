<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
  </head>

  <body>
    <header class="header-content">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix" />
      <a
        class="more-info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </header>

    <main class="main-content">
      <p id="ad-tasks"></p>
      <label for="new-task">Add Item</label>
      <div class="task-row-wrapper">
        <input id="new-task" class="task-input" type="text" />
        <button class="add-button">Add</button>
      </div>

      <h3>Todo</h3>
      <ul id="incomplete-tasks">
        <li class="task-item">
          <input type="checkbox" />
          <label class="task-label">Pay Bills</label>
          <input type="text" class="task-edit" />
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img src="./remove.svg" alt="Remove task" />
          </button>
        </li>

        <li class="task-item edit-mode">
          <input type="checkbox" />
          <label class="task-label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task-edit" />
          <button class="edit-button">Save</button>
          <button class="delete-button">
            <img src="./remove.svg" alt="Remove task" />
          </button>
        </li>
      </ul>

      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li class="task-item">
          <input type="checkbox" checked />
          <label class="task-label">See the Doctor</label>
          <input type="text" class="task-edit" />
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img src="./remove.svg" alt="Remove task" />
          </button>
        </li>
      </ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
